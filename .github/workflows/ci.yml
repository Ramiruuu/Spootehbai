name: CI

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x

      - name: Install dependencies
        run: npm install

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Run tests
        run: npm test
